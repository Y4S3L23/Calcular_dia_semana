<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16284a"/>
      <stop offset="1" stop-color="#24457f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#puntos)"/>

  <circle cx="200" cy="230" r="260" fill="url(#glow)"/>

  <g font-family="Georgia, serif" fill="#ffffff" opacity="0.18">
    <text x="40" y="120" font-size="22">1582</text>
    <text x="640" y="150" font-size="28">1900</text>
    <text x="120" y="700" font-size="26">2026</text>
    <text x="560" y="620" font-size="22">3000</text>
    <text x="660" y="720" font-size="18" opacity="0.7">1 2 3 4 15 16 17</text>
  </g>

  <g transform="translate(180,190)" stroke="#ffffff" stroke-opacity="0.35" fill="none">
    <circle cx="0" cy="0" r="160"/>
    <circle cx="0" cy="0" r="150"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" fill-opacity="0.35" stroke="none"/>
    <g font-family="sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.55" stroke="none" text-anchor="middle">
      <text x="0" y="-125">12</text>
      <text x="125" y="8">3</text>
      <text x="0" y="142">6</text>
      <text x="-125" y="8">9</text>
    </g>
    <g stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-95" opacity="0.7"/>
    </g>
    <g stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="70" y2="55" opacity="0.7"/>
    </g>
    <g stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="-35" y2="-80" opacity="0.7"/>
    </g>
  </g>

  <g transform="rotate(-8 560 560)">
    <rect x="470" y="430" width="210" height="250" rx="14" fill="#101d3a" fill-opacity="0.55"
          stroke="#ffffff" stroke-opacity="0.30" stroke-width="2"/>
    <rect x="505" y="430" width="18" height="34" rx="6" fill="#ffffff" opacity="0.18"/>
    <rect x="627" y="430" width="18" height="34" rx="6" fill="#ffffff" opacity="0.18"/>
    <rect x="470" y="492" width="210" height="42" rx="10" fill="#ffffff" opacity="0.10"/>
    <text x="575" y="522" font-family="Georgia, serif" font-size="22" fill="#ffffff" opacity="0.75" text-anchor="middle">SEPTIEMBRE</text>
    <text x="575" y="636" font-family="Georgia, serif" font-size="96" fill="#ffffff" opacity="0.30" text-anchor="middle">23</text>
    <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
      <line x1="490" y1="560" x2="660" y2="560"/>
      <line x1="490" y1="580" x2="660" y2="580"/>
    </g>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <circle cx="640" cy="120" r="18"/>
    <circle cx="120" cy="700" r="18"/>
  </g>
