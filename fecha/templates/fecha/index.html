<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular día de la semana</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'fecha/favicon.svg' %}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: url("{% static 'fecha/background.svg' %}") center / 73% auto no-repeat, linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            color: #1e3c72;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .fila-fecha {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        select, input[type="number"] {
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            flex: 1;
        }
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #2a5298;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        button {
            width: 100%;
            padding: 0.85rem;
            background: #2a5298;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1e3c72; }
        .error {
            background: #fee;
            color: #c00;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .resultado {
            background: #f0f7ee;
            border: 2px solid #7cb342;
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 1.5rem;
            text-align: center;
        }
        .resultado .fecha { color: #555; font-size: 0.95rem; }
        .resultado .dia {
            color: #33691e;
            font-size: 2rem;
            font-weight: 700;
            text-transform: capitalize;
            margin-top: 0.35rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Calcular día de la semana</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'fecha:calcular_dia' %}" id="form-fecha">
            {% csrf_token %}
            <label for="dia">Selecciona una fecha</label>
            <div class="fila-fecha">
                <input type="number" id="dia" name="dia" inputmode="numeric" placeholder="Día">
                <input type="number" id="mes" name="mes" inputmode="numeric" placeholder="Mes">
                <input type="number" id="anio" name="anio" inputmode="numeric" placeholder="Año">
            </div>
            <input type="hidden" id="fecha" name="fecha" value="">
            <button type="submit">Calcular</button>
            <div class="error" id="error-cliente" hidden></div>
        </form>

        {% if dia_semana %}
            <div class="resultado">
                <div class="fecha">{{ fecha_formateada }}</div>
                <div class="dia">{{ dia_semana }}</div>
            </div>
        {% endif %}
    </div>

    <script>
        const DIAS_POR_MES = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        function esBisiesto(anio) {
            return (anio % 4 === 0 && anio % 100 !== 0) || anio % 400 === 0;
        }

        function diasDeMes(anio, mes) {
            return DIAS_POR_MES[mes - 1] + (mes === 2 && esBisiesto(anio) ? 1 : 0);
        }

        function fechaValida(anio, mes, dia) {
            if (!Number.isInteger(anio) || !Number.isInteger(mes) || !Number.isInteger(dia)) {
                return false;
            }
            if (anio < 1000 || anio > 3000 || mes < 1 || mes > 12 || dia < 1) {
                return false;
            }
            if (anio === 1582 && mes === 10) {
                return dia <= 4 || (dia >= 15 && dia <= 31);
            }
            return dia <= diasDeMes(anio, mes);
        }

        document.addEventListener('DOMContentLoaded', function () {
            const diaInput = document.getElementById('dia');
            const mesInput = document.getElementById('mes');
            const anioInput = document.getElementById('anio');
            const fechaHidden = document.getElementById('fecha');
            const errorLocal = document.getElementById('error-cliente');

            function construirFecha() {
                fechaHidden.value =
                    String(parseInt(anioInput.value, 10)).padStart(4, '0') + '-' +
                    String(parseInt(mesInput.value, 10)).padStart(2, '0') + '-' +
                    String(parseInt(diaInput.value, 10)).padStart(2, '0');
            }

            [diaInput, mesInput, anioInput].forEach(function (el) {
                el.addEventListener('input', function () { errorLocal.hidden = true; });
            });

            document.getElementById('form-fecha').addEventListener('submit', function (e) {
                const anio = parseInt(anioInput.value, 10);
                const mes = parseInt(mesInput.value, 10);
                const dia = parseInt(diaInput.value, 10);

                if (!anioInput.value.trim() || !mesInput.value.trim() || !diaInput.value.trim()) {
                    e.preventDefault();
                    errorLocal.textContent = 'Completa el día, el mes y el año.';
                    errorLocal.hidden = false;
                    fechaHidden.value = '';
                    return;
                }
                if (!fechaValida(anio, mes, dia)) {
                    e.preventDefault();
                    errorLocal.textContent = 'La fecha ingresada no es válida. Año: 1000-3000, mes: 1-12 y un día que exista en ese mes.';
                    errorLocal.hidden = false;
                    fechaHidden.value = '';
                    return;
                }
                errorLocal.hidden = true;
                construirFecha();
            });

            document.getElementById('form-fecha').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this.requestSubmit();
                }
            });
        });
    </script>
</body>
</html>
