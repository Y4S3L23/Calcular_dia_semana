<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular día de la semana</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'fecha/favicon.svg' %}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: url("{% static 'fecha/background.svg' %}") center / 73% auto no-repeat, linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            color: #1e3c72;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .fila-fecha {
            display: grid;
            grid-template-columns: 4.5rem 5.25rem 6.5rem;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        select, input[type="text"] {
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            flex: 1;
            text-align: center;
        }
        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #2a5298;
        }
        input[type="text"].campo-invalido {
            border-color: #c00;
            background: #fde;
        }
        button {
            width: 100%;
            padding: 0.85rem;
            background: #2a5298;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1e3c72; }
        .error {
            background: #fee;
            color: #c00;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .resultado {
            background: #f0f7ee;
            border: 2px solid #7cb342;
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 1.5rem;
            text-align: center;
        }
        .resultado .fecha { color: #555; font-size: 0.95rem; }
        .resultado .dia {
            color: #33691e;
            font-size: 2rem;
            font-weight: 700;
            text-transform: capitalize;
            margin-top: 0.35rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Calcular día de la semana</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'fecha:calcular_dia' %}" id="form-fecha">
            {% csrf_token %}
            <label for="dia">Selecciona una fecha</label>
            <div class="fila-fecha">
                <input type="text" id="dia" name="dia" list="lista-dias" inputmode="numeric" pattern="[0-9]*" placeholder="Día">
                <input type="text" id="mes" name="mes" list="lista-meses" inputmode="numeric" pattern="[0-9]*" placeholder="Mes">
                <input type="text" id="anio" name="anio" list="lista-anios" inputmode="numeric" pattern="[0-9]*" placeholder="Año">
            </div>
            <datalist id="lista-dias"></datalist>
            <datalist id="lista-meses">
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
                <option value="4">Abril</option>
                <option value="5">Mayo</option>
                <option value="6">Junio</option>
                <option value="7">Julio</option>
                <option value="8">Agosto</option>
                <option value="9">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </datalist>
            <datalist id="lista-anios"></datalist>
            <input type="hidden" id="fecha" name="fecha" value="">
            <button type="submit">Calcular</button>
            <div class="error" id="error-cliente" hidden></div>
        </form>

        {% if dia_semana %}
            <div class="resultado">
                <div class="fecha">{{ fecha_formateada }}</div>
                <div class="dia">{{ dia_semana }}</div>
            </div>
        {% endif %}
    </div>

    <script>
        const DIAS_POR_MES = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        function esBisiesto(anio) {
            return (anio % 4 === 0 && anio % 100 !== 0) || anio % 400 === 0;
        }

        function diasDeMes(anio, mes) {
            return DIAS_POR_MES[mes - 1] + (mes === 2 && esBisiesto(anio) ? 1 : 0);
        }

        function fechaValida(anio, mes, dia) {
            if (!Number.isInteger(anio) || !Number.isInteger(mes) || !Number.isInteger(dia)) {
                return false;
            }
            if (anio < 1000 || anio > 3000 || mes < 1 || mes > 12 || dia < 1) {
                return false;
            }
            if (anio === 1582 && mes === 10) {
                return dia <= 4 || (dia >= 15 && dia <= 31);
            }
            return dia <= diasDeMes(anio, mes);
        }

        function soloDigitos(e) {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key && e.key.length === 1) {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                    return;
                }
                const [min, max] = LIMITES[e.target.id];
                const futuro = parseInt(e.target.value + e.key, 10);
                if (Number.isInteger(futuro) && futuro > max) {
                    e.preventDefault();
                }
            }
        }

        const LIMITES = { dia: [1, 31], mes: [1, 12], anio: [1000, 3000] };

        function validarCampo(el) {
            el.value = el.value.replace(/\D/g, '');
            const [min, max] = LIMITES[el.id];
            if (el.value !== '') {
                const v = parseInt(el.value, 10);
                if (v > max) {
                    el.value = String(max);
                } else if (v < min && el.id !== 'anio') {
                    el.value = '';
                }
            }
            const valor = parseInt(el.value, 10);
            const ok = el.value !== '' && Number.isInteger(valor) && valor >= min && valor <= max;
            el.classList.toggle('campo-invalido', !ok);
            return ok;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const diaInput = document.getElementById('dia');
            const mesInput = document.getElementById('mes');
            const anioInput = document.getElementById('anio');
            const fechaHidden = document.getElementById('fecha');
            const errorLocal = document.getElementById('error-cliente');

            function rellenarLista(id, desde, hasta) {
                const dl = document.getElementById(id);
                dl.innerHTML = '';
                for (let v = desde; v <= hasta; v++) {
                    const op = document.createElement('option');
                    op.value = String(v);
                    dl.appendChild(op);
                }
            }
            rellenarLista('lista-dias', 1, 31);
            rellenarLista('lista-anios', 1000, 3000);

            function construirFecha() {
                fechaHidden.value =
                    String(parseInt(anioInput.value, 10)).padStart(4, '0') + '-' +
                    String(parseInt(mesInput.value, 10)).padStart(2, '0') + '-' +
                    String(parseInt(diaInput.value, 10)).padStart(2, '0');
            }

            [diaInput, mesInput, anioInput].forEach(function (el) {
                el.addEventListener('keydown', soloDigitos);
                el.addEventListener('input', function () { validarCampo(el); errorLocal.hidden = true; });
            });

            document.getElementById('form-fecha').addEventListener('submit', function (e) {
                const anio = parseInt(anioInput.value, 10);
                const mes = parseInt(mesInput.value, 10);
                const dia = parseInt(diaInput.value, 10);

                if (!anioInput.value.trim() || !mesInput.value.trim() || !diaInput.value.trim()) {
                    e.preventDefault();
                    errorLocal.textContent = 'Completa el día, el mes y el año.';
                    errorLocal.hidden = false;
                    fechaHidden.value = '';
                    return;
                }
                if (!fechaValida(anio, mes, dia)) {
                    e.preventDefault();
                    errorLocal.textContent = 'La fecha ingresada no es válida. Año: 1000-3000, mes: 1-12 y un día que exista en ese mes.';
                    errorLocal.hidden = false;
                    fechaHidden.value = '';
                    return;
                }
                errorLocal.hidden = true;
                construirFecha();
            });

            document.getElementById('form-fecha').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this.requestSubmit();
                }
            });
        });
    </script>
</body>
</html>
